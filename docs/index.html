<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>売上伝票発行依頼書</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
/* 業務アプリポータルへ戻るボタン（太陽ポータルの全アプリ共通。色・大きさ・字はどのアプリでも同じにするため、アプリの書式に負けないよう !important。
   ユーザーの指示「太陽ポータルに戻るボタンは左上に設置。太陽ポータル全アプリ共通にする。色や大きさも含めて統一する」2026-10-28。決まりは taiyo-portal スキル） */
.taiyo-portal-back{display:inline-flex!important;align-items:center!important;gap:4px;box-sizing:border-box!important;height:34px!important;margin:0;padding:0 12px!important;border:1px solid #cbd5e1!important;border-radius:8px!important;background:#fff!important;color:#334155!important;font:500 13px/1 "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif!important;letter-spacing:0!important;text-decoration:none!important;white-space:nowrap!important;flex:none!important;box-shadow:0 1px 2px rgba(15,23,42,.08)!important}
.taiyo-portal-back:hover{background:#f1f5f9!important;color:#0f172a!important}
.taiyo-portal-back:focus-visible{outline:2px solid #64748b!important;outline-offset:2px}
@media print{.taiyo-portal-back{display:none!important}}

      html, body, #root { min-height: 100%; margin: 0; }
      /* 色・書体は「申請書・見積書作成」（太陽ポータルの jutaku-mitsumori/）と同じ（ユーザーの指示「水色ではなく、申請書見積もりアプリと同様の色合い、書体など」2026-10-28） */
      body {
        font-family: 'Yu Gothic UI', 'Meiryo', 'BIZ UDPGothic', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
        background: #f2f6f4;
        color: #1e293b;
      }
      .uriage-app-shell {
        min-height: 100vh;
        background: #f2f6f4;
      }
      .uriage-hero {
        background: #14532d;
      }
      .uriage-brand-mark {
        background: rgba(255, 255, 255, .15);
      }
      .share-box {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: .75rem;
        padding: .7rem .85rem;
        border: 1px solid #a7f3d0;
        border-radius: .75rem;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
      }
      .toggle-button {
        border-radius: .5rem;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #334155;
        font-weight: 700;
      }
      .toggle-button:hover { filter: brightness(.98); }
      /* PDF書き出し用：画面外で帳票を実寸表示してキャプチャする */
      .pdf-export-sandbox {
        position: fixed;
        top: 0;
        left: -20000px;
        z-index: -1;
        width: 190mm;
        background: #fff;
        pointer-events: none;
      }
      .pdf-export-document {
        display: block !important;
        width: 190mm !important;
        padding: 4mm !important;
        background: #fff !important;
      }
      @media print {
        @page { size: A4 portrait; margin: 10mm; }
        body { background: white; }
        .uriage-print { display: block !important; }
        /* 印刷時も見出し・強調の色をそのまま出す */
        * { print-color-adjust: exact !important; -webkit-print-color-adjust: exact !important; }
      }
    </style>
    <script type="module" crossorigin src="/taiyo-uriage-denpyo/assets/index-3-lDFeTr.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
