<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>売上伝票発行依頼書</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic", sans-serif;
        background: #f8fbff;
        color: #1e293b;
      }
      .uriage-app-shell {
        min-height: 100vh;
        background: #f0f9ff;
      }
      .uriage-hero {
        border: 1px solid #bae6fd;
        background: #ffffff;
        box-shadow: 0 12px 30px rgba(14, 165, 233, .10);
      }
      .uriage-brand-mark {
        background: #0284c7;
        box-shadow: 0 8px 20px rgba(2, 132, 199, .24);
      }
      .share-box {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: .75rem;
        padding: .7rem .85rem;
        border: 1px solid #bae6fd;
        border-radius: 1rem;
        background: #f0f9ff;
        box-shadow: 0 10px 24px rgba(14, 165, 233, .08);
      }
      .toggle-button {
        border-radius: .75rem;
        background: #0284c7;
        color: white;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(2, 132, 199, .18);
      }
      .toggle-button:hover { filter: brightness(.98); }
      /* PDF書き出し用：画面外で帳票を実寸表示してキャプチャする */
      .pdf-export-sandbox {
        position: fixed;
        top: 0;
        left: -20000px;
        z-index: -1;
        width: 190mm;
        background: #fff;
        pointer-events: none;
      }
      .pdf-export-document {
        display: block !important;
        width: 190mm !important;
        padding: 4mm !important;
        background: #fff !important;
      }
      @media print {
        @page { size: A4 portrait; margin: 10mm; }
        body { background: white; }
        .uriage-print { display: block !important; }
        /* 印刷時も見出し・強調の色をそのまま出す */
        * { print-color-adjust: exact !important; -webkit-print-color-adjust: exact !important; }
      }
    </style>
    <script type="module" crossorigin src="/taiyo-uriage-denpyo/assets/index-BPa9av07.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
